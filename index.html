<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17283d"><title>Котёнок-рыцарь — русский язык</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff6dd;background:#12233c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#35557b,#172b48 55%,#101e35);overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff88 1px,transparent 1px);background-size:63px 71px;opacity:.33}main{position:relative;max-width:1100px;margin:auto;min-height:100vh;padding:22px clamp(16px,3vw,32px);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.03em;color:#f9d48a}.chip{background:#ffffff16;border:1px solid #ffffff29;border-radius:30px;padding:9px 15px;font-size:14px}.game{flex:1;display:flex;flex-direction:column;justify-content:center}.intro{text-align:center;max-width:770px;margin:0 auto}.eyebrow{text-transform:uppercase;letter-spacing:.17em;color:#fac775;font-size:13px;font-weight:900}.intro h1{font-size:clamp(39px,7vw,76px);line-height:1.05;margin:16px 0;color:#fff2cb;text-shadow:0 5px #0c1b2d}.intro p{font-size:clamp(17px,2.3vw,21px);color:#cbd8eb;line-height:1.6;margin:20px auto 30px;max-width:610px}.scene{position:relative;display:flex;align-items:flex-end;justify-content:space-around;gap:12px;min-height:230px;margin:0 auto 12px;max-width:750px}.hero,.dragon{font-size:clamp(95px,19vw,185px);filter:drop-shadow(0 15px 8px #07172b88);position:relative;z-index:1}.dragon{transform:scaleX(-1)}.ground{position:absolute;bottom:3px;left:5%;width:90%;height:38px;border-radius:50%;background:#0b1a2c66}.castle{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:95px;opacity:.55}.btn{border:0;font:900 18px system-ui,sans-serif;cursor:pointer;border-radius:19px;padding:16px 29px;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn.primary{background:linear-gradient(180deg,#ffdc80,#f2a843);color:#392a23;box-shadow:0 7px 0 #a36b30}.btn.secondary{background:#ffffff18;border:1px solid #ffffff3a;color:white}.foot{text-align:center;color:#8196b2;font-size:12px;margin-top:18px}.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:17px 0}.hearts{font-size:23px;letter-spacing:4px}.progress{height:12px;background:#0c1930;border-radius:40px;overflow:hidden;border:1px solid #ffffff22;flex:1;min-width:140px}.fill{height:100%;width:0;background:linear-gradient(90deg,#77dcc4,#ffd679);transition:width .5s}.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,390px);gap:30px;align-items:center;flex:1}.question-card{background:linear-gradient(145deg,#fef5df,#f4e7ca);color:#24354a;border-radius:30px;box-shadow:0 20px 0 #08192b60,0 35px 70px #07172866;padding:clamp(20px,4vw,42px);border:4px solid #e4bd74}.level{font-weight:900;color:#a16d31;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.question-card h2{font-size:clamp(24px,3.7vw,38px);line-height:1.25;color:#21334a;margin:17px 0 25px}.answers{display:grid;gap:12px}.answer{font:800 clamp(17px,2.4vw,22px) system-ui,sans-serif;text-align:left;border:2px solid #d6c4a4;border-radius:17px;padding:15px 18px;background:#fffaf0;color:#253b55;cursor:pointer;min-height:57px}.answer:hover:not(:disabled){border-color:#e5a640;background:#fff0cf}.answer:disabled{cursor:default}.answer.correct{background:#d3efcf;border-color:#4a9a5d}.answer.wrong{background:#ffdad1;border-color:#cc7662}.feedback{margin-top:15px;min-height:26px;color:#46617c;font-weight:800}.side{text-align:center}.side .hero,.side .dragon{font-size:clamp(100px,13vw,150px)}.side-scene{display:flex;align-items:center;justify-content:center;gap:4px}.side .dragon{opacity:.9}.speech{background:#ffffff14;border:1px solid #ffffff28;border-radius:19px;padding:18px;color:#e5e6e1;font-weight:800;font-size:17px;margin-top:20px}.energy{height:15px;border-radius:20px;background:#081a30;overflow:hidden;margin:12px 0}.energy>div{height:100%;width:100%;background:linear-gradient(90deg,#ef8d67,#ffcf70);transition:width .4s}.end{text-align:center;max-width:690px;margin:auto}.end h2{font-size:clamp(36px,6vw,64px);color:#ffdd8c;margin:12px}.end p{font-size:20px;line-height:1.6;color:#d9e2ed}.prize{font-size:110px;margin:22px}.muted{color:#94aac2;font-size:14px}.spark{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:760px){.arena{grid-template-columns:1fr;gap:16px}.side{order:-1}.side-scene{height:100px}.side .hero,.side .dragon{font-size:77px}.speech{display:none}.question-card{border-radius:24px}.hud{margin:14px 0}.scene{min-height:165px}.castle{font-size:70px}.chip{font-size:12px}}
</style></head><body><div class="stars"></div><main><header class="top"><div class="brand">⚔️ КОТОКОРОЛЕВСТВО</div><div class="chip" id="headChip">Русский язык · 2 класс</div></header><div class="game" id="app"></div><footer class="foot">Задания по упражнениям 216–230 из вашей презентации · 40 испытаний</footer></main><script>
// All lexical material is drawn from Russian-language exercises 216–230 in the supplied PPTX.
const questions=[
['Вставь букву: зв...риный','е',['е','и','я'],'217 · безударная гласная'],
['Какое проверочное слово к «звериный»?','зверь',['зверь','зверёк','звериный'],'217 · проверочное слово'],
['Вставь букву: л...нивый','е',['и','е','я'],'217 · безударная гласная'],
['Какое проверочное слово к «пл...довый»?','плод',['плод','плоды','плодовый'],'217 · проверочное слово'],
['Вставь букву: ч...рвивый','е',['и','я','е'],'217 · безударная гласная'],
['Какое проверочное слово к «л...сной»?','лес',['лесной','леса','лес'],'217 · проверочное слово'],
['Вставь букву: цв...тной','е',['е','и','я'],'217 · безударная гласная'],
['Какое проверочное слово к «ст...льной»?','сталь',['сталь','стальной','стали'],'217 · проверочное слово'],
['Исправь ошибку: «Свистит ветир».','Свистит ветер.',['Свистит ветир.','Свистит ветер.','Свистит витер.'],'218 · исправь ошибку'],
['Вставь букву: на дв...ре','о',['а','о','е'],'218 · безударная гласная'],
['Вставь букву: б...льшие сугробы','о',['о','а','е'],'218 · безударная гласная'],
['Как правильно написать?','везут санки',['визут санки','везут санки','везат санки'],'218 · исправь ошибку'],
['Как правильно написать?','несут лыжи',['нисут лыжы','несут лыжи','несут лыжы'],'218 · исправь ошибку'],
['Какое слово близко по смыслу к «проснулся в серебре»?','покрылся инеем',['покрылся инеем','стал зелёным','потемнел'],'219 · смысл выражения'],
['Вставь букву: в сн...гах','е',['и','е','я'],'220 · безударная гласная'],
['Какое проверочное слово к «сл...да»?','след',['следы','след','следа'],'220 · проверочное слово'],
['Вставь букву: в л...су','е',['е','и','я'],'220 · безударная гласная'],
['Какое проверочное слово к «цв...тут»?','цвет',['цветут','цветок','цвет'],'220 · проверочное слово'],
['Исправь ошибку: «Одуванчик стал сидой».','Одуванчик стал седой.',['Одуванчик стал седой.','Одуванчик стал сядой.','Одуванчик стал сидой.'],'220 · исправь ошибку'],
['Как правильно: «Под ...кном Гвидон сидит»?','окном',['акном','окном','икном'],'220 · безударная гласная'],
['Какое слово подходит: «Филин ...»?','кричал',['скрипела','кричал','пищала'],'221 · составь предложение'],
['Какое слово подходит: «Мышка ...»?','пищала',['визжал','стонал','пищала'],'221 · составь предложение'],
['Вставь букву: пт...нец','е',['и','е','а'],'222 · безударная гласная'],
['Какое проверочное слово к «м...док»?','мёд',['медок','медовый','мёд'],'222 · проверочное слово'],
['Вставь букву: к...нец','о',['а','о','е'],'222 · безударная гласная'],
['Какое проверочное слово к «сн...жок»?','снег',['снежок','снег','снега'],'222 · проверочное слово'],
['Где нужна точка? «Наступил конец осени занесло снежком всю площадь».','После «осени»',['После «конец»','После «осени»','После «снежком»'],'223 · границы предложений'],
['Вставь букву: покрылась л...дком','е',['е','и','я'],'223 · безударная гласная'],

['Какое проверочное слово для «далеко»?','даль',['далёкий','далеко','даль'],'224 · проверочное слово'],
['Вставь букву: стали б...леть','о',['а','о','е'],'225 · безударная гласная'],
['Выбери слово с разделительным мягким знаком.','жилья',['птички','жилья','синички'],'225 · правило'],
['Как правильно: «Птицы ... под крышей»?','ночевали',['начевали','ночевали','ничевали'],'225 · безударная гласная'],
['Вставь букву: ч...рнила','е',['и','е','я'],'227 · безударная гласная'],
['Какое слово однокоренное к «тихий»?','тишина',['темнота','тишина','чистота'],'227 · однокоренные слова'],
['Вставь букву: Не хв...лись началом','а',['о','а','е'],'228 · безударная гласная'],

];
let index=0, mistakes=0, selected=false, score=0;const app=document.getElementById('app'),head=document.getElementById('headChip');const shuffle=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);let order=[];
function start(){index=0;mistakes=0;score=0;order=shuffle(questions.map((_,i)=>i));renderQuestion()}
function intro(){head.textContent='Русский язык · 2 класс';app.innerHTML=`<section class="intro"><div class="eyebrow">Приключение начинается</div><h1>Котёнок-рыцарь<br>и огненный дракон</h1><div class="scene"><div class="ground"></div><div class="hero spark">🐱‍👤</div><div class="castle">🏰</div><div class="dragon spark">🐉</div></div><p>Злой дракон украл волшебные буквы! Помоги храброму котёнку пройти <b>40 испытаний</b>, собрать звёзды и освободить королевство слов.</p><button class="btn primary" onclick="start()">Начать приключение ⚔️</button><div class="muted" style="margin-top:24px">Выбирай ответ. Если ошибёшься, сможешь попробовать ещё раз.</div></section>`}
function renderQuestion(){selected=false;const q=questions[order[index]],phase=Math.floor(index/10)+1;head.textContent=`Испытание ${index+1} из 40`;const hearts='❤️'.repeat(Math.max(1,5-Math.min(4,mistakes)));app.innerHTML=`<div class="hud"><span class="chip">Глава ${phase} / 4 · ${['Тёмный лес','Башня ошибок','Мост знаний','Логово дракона'][phase-1]}</span><span class="hearts" aria-label="Сердечки">${hearts}</span><div class="progress"><div class="fill" style="width:${index/40*100}%"></div></div><span class="chip">⭐ ${score}</span></div><div class="arena"><article class="question-card"><div class="level">Испытание ${index+1} · ${q[3]}</div><h2>${q[0]}</h2><div class="answers">${shuffle(q[2]).map(a=>`<button class="answer" data-value="${a.replaceAll('"','&quot;')}">${a}</button>`).join('')}</div><div class="feedback" id="feedback">Выбери один ответ</div></article><aside class="side"><div class="side-scene"><div class="hero">🐱‍👤</div><div class="dragon">🐉</div></div><div class="speech">${index<10?'Наш меч — знания!':index<20?'Мы всё ближе к замку!':index<30?'Дракон уже нервничает!':'Последний рывок! Ты справишься!'}</div><div style="margin-top:20px;color:#dfad85;font-weight:900">Сила дракона</div><div class="energy"><div style="width:${100-index/40*100}%"></div></div><div class="muted">Каждый верный ответ ослабляет дракона</div></aside></div>`;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(b,q)))}
function choose(btn,q){if(selected)return;const good=btn.dataset.value===q[1],fb=document.getElementById('feedback');if(!good){btn.classList.add('wrong');btn.disabled=true;mistakes++;fb.textContent='🛡️ Почти! Попробуй другой вариант.';return}selected=true;score++;btn.classList.add('correct');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);fb.textContent='✨ Верно! Дракон теряет силу!';setTimeout(()=>{index++;if(index===40)end();else renderQuestion()},1050)}
function end(){head.textContent='Победа!';app.innerHTML=`<section class="end"><div class="eyebrow">Королевство спасено</div><div class="prize spark">🏆🐱</div><h2>Дракон побеждён!</h2><p>Ты прошёл все <b>40 испытаний</b>, вернул волшебные буквы и стал настоящим рыцарем русского языка!</p><p>⭐ Правильных ответов: <b>${score}</b><br>🛡️ Дополнительных попыток: <b>${mistakes}</b></p><button class="btn primary" onclick="start()">Пройти квест ещё раз</button><button class="btn secondary" style="margin:12px" onclick="intro()">На главную</button></section>`}intro();
</script></body></html>
